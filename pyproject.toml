[project]
name = "radiosmith"
version = "0.1.0"
description = "Local radio programmer for the Baofeng DM-32UV and Radtel RT-950 PRO, with a web interface and an MCP server"
authors = [
    { name = "Todd Bartholow", email = "872232+ToddBartholow@users.noreply.github.com" }
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "mcp>=1.10",
    "pyserial>=3.5",
    "textual>=1.0",
    "uvicorn>=0.30",
]

[project.scripts]
radiosmith = "radiosmith:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
